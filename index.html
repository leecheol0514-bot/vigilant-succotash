<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 기술 위력 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>포켓몬 기술 위력 계산기</h1>
      <p>Python 파일 다운로드와 웹 계산기를 동시에 제공합니다.</p>
    </header>

    <main>
      <section class="card">
        <h2>웹 계산기</h2>
        <form id="damage-form">
          <label>포켓몬 레벨<input type="number" id="level" min="1" max="100" value="50" required></label>
          <label>기술 위력<input type="number" id="power" min="1" value="80" required></label>
          <label>공격력<input type="number" id="atk" min="1" value="100" required></label>
          <label>방어력<input type="number" id="def" min="1" value="100" required></label>
          <label>STAB<input type="checkbox" id="stab" checked> 동일 타입 여부</label>
          <label>상성 효과<input type="number" id="eff" min="0" step="0.1" value="1.0"></label>
          <label><input type="checkbox" id="crit"> 크리티컬</label>
          <label><input type="checkbox" id="burn"> 화상</label>
          <label>기타 보정값<input type="number" id="extra" min="0.1" step="0.1" value="1.0"></label>
          <button type="submit">계산하기</button>
        </form>
        <div id="result" class="result"></div>
      </section>

      <section class="card">
        <h2>파이썬 버전 다운로드</h2>
        <p>아래 버튼을 눌러 로컬에서 실행할 수 있는 원본 Python 파일을 다운로드하세요.</p>
        <a class="button" href="pokemon_damage_calculator.py" download>파이썬 파일 내려받기</a>
      </section>

      <section class="card">
        <h2>사용 방법</h2>
        <ul>
          <li>레벨, 기술 위력, 공격력, 방어력을 입력합니다.</li>
          <li>STAB, 상성, 크리티컬, 화상, 기타 보정을 지정합니다.</li>
          <li>계산 결과는 예상 피해량과 적용 상태를 함께 보여줍니다.</li>
        </ul>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
